; Claudio's colours: used by the animated glow around the sidebar (KWin script claudio-glow), by the tray icon while
; Claude is working (claudio-tray) and by the active tab. Edit your copy in ~/.config/claudio/colors.conf:
; changes show up by themselves within a few seconds, nothing to restart.
; Format #rrggbb. Comments go on lines of their own, starting with ";".

[glow]
; 2 to 4 colours that flow into each other (color3 and color4 are optional: leave them empty or remove them)
color1=#2fb4ff
color2=#ff8a2b
color3=#e1306c
color4=#fd1d1d
; a highlight that sweeps along the glow once per cycle (empty = none)
highlight=
