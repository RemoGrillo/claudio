; Claudio's colours: the animated glow around the sidebar (KWin script claudio-glow), the tray icon while Claude is
; working (claudio-tray) and the active tab. Pick a theme or make your own with the colour editor (claudio-colors, also in
; the tray menu → Glow → Customise colours…). Changes show up by themselves within a few seconds.
; [glow] holds the colours in use; [custom] keeps your own theme while a built-in one is selected.

[glow]
; aurora, nebula, ember or custom
theme=aurora
; 2 to 4 colours that flow into each other (color3 and color4 are optional: leave them empty)
color1=#2fb4ff
color2=#ff8a2b
color3=#e1306c
color4=#fd1d1d
; a highlight that sweeps along the glow once per cycle (empty = none)
highlight=

[custom]
color1=#2fb4ff
color2=#ff8a2b
color3=#e1306c
color4=#fd1d1d
highlight=
