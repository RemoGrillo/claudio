# Claudio: a separate Ghostty instance that stays in the background and shows Claude Code in a quick terminal docked
# to the right edge of the screen, above every virtual desktop. Started by `claudio`, which also passes the command
# and the stylesheets. Everything else (font, theme, blur, …) comes from your normal Ghostty config.
# Put your own changes in ~/.config/claudio/ghostty.conf: it is read last.

# dedicated instance, separate from your normal Ghostty
class = io.github.remogrillo.claudio
gtk-single-instance = true
initial-window = false
quit-after-last-window-closed = false
working-directory = home

# sidebar on the right, 34% of the screen wide and 88% tall: Ghostty centres it vertically, so it clears a floating
# panel at the bottom of the screen
quick-terminal-position = right
quick-terminal-size = 34%,88%
# more transparent than a normal terminal: with KWin's blur (or Better Blur DX) the desktop shows through, frosted
background-opacity = 0.6
# with autohide = true, Ghostty 1.3 on KDE never reopens the quick terminal after the first close
quick-terminal-autohide = false
quick-terminal-keyboard-interactivity = on-demand

# global shortcut, registered through the desktop portal (KDE asks for confirmation the first time).
# Change it in System Settings → Keyboard → Shortcuts → Claudio.
keybind = global:super+c=toggle_quick_terminal

# several chats side by side, one per tab, each running `claude` (Claude Code titles the tab after the conversation).
# New chat Ctrl+Shift+T, close Ctrl+Shift+W, switch Ctrl+Tab / Alt+1..9 (Ghostty's default keys).
# The tab bar only shows up with 2 or more tabs.
window-show-tab-bar = auto
gtk-wide-tabs = false
window-new-tab-position = end

config-file = ?~/.config/claudio/ghostty.conf
